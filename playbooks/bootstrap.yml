- name: Bootstrap ansible access on new hosts
  hosts: all
  become: yes
  gather_facts: yes

  tasks:

    - name: Ensure ansible user exists
      ansible.builtin.user:
        name: ansible
        state: present
        shell: /bin/bash
        create_home: yes

    - name: Add SSH public key for ansible user
      ansible.builtin.authorized_key:
        user: ansible
        state: present
        key: "{{ lookup('file', 'files/id_rsa.pub') }}"
